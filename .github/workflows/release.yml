name: Release ZCAM1 SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown

      - name: "Install protoc"
        run: |
          brew install protobuf

      - name: "Install sp1up"
        run: |
          set -o pipefail

          echo "::group::Download sp1up installer"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            https://sp1.succinct.xyz -o /tmp/sp1up-install.sh
          echo "Installer path: /tmp/sp1up-install.sh"
          echo "Installer size: $(wc -c < /tmp/sp1up-install.sh) bytes"
          chmod +x /tmp/sp1up-install.sh
          echo "::endgroup::"

          echo "::group::Run sp1up installer (bash -x)"
          bash -x /tmp/sp1up-install.sh 2>&1 | tee sp1up-install.log
          installer_exit_code=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ $installer_exit_code -ne 0 ]; then
            echo "::error::sp1up installer failed with exit code $installer_exit_code"
            echo "::group::sp1up installer failure log"
            sed -n '1,240p' sp1up-install.log
            echo "::endgroup::"
            exit $installer_exit_code
          fi

          echo "::group::Verify sp1up installation"
          command -v sp1up || true
          sp1up --help | sed -n '1,12p'
          echo "::endgroup::"

          echo "$HOME/.sp1/bin" >> $GITHUB_PATH

      - name: "Install SP1 toolchain"
        run: |
          set -o pipefail
          SP1UP_TOKEN="${{ secrets.GH_TOKEN }}"

          if [ -z "$SP1UP_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is empty or not configured."
            exit 1
          fi

          echo "::group::SP1 toolchain install diagnostics"
          echo "Runner: $RUNNER_OS"
          echo "sp1up path: $(command -v sp1up || echo 'not found')"
          sp1up --help | sed -n '1,20p'
          echo "Token provided: yes"
          echo "Token length: ${#SP1UP_TOKEN}"
          echo "::endgroup::"

          echo "::group::Resolve SP1 latest release tag (authenticated)"
          releases_json=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $SP1UP_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/succinctlabs/sp1/releases/latest)
          sp1_version=$(printf '%s' "$releases_json" | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)

          if [ -z "$sp1_version" ]; then
            echo "::error::Failed to parse tag_name from GitHub releases API response."
            echo "::group::Raw releases API response (truncated)"
            printf '%s\n' "$releases_json" | sed -n '1,80p'
            echo "::endgroup::"
            exit 1
          fi
          echo "Resolved SP1 version: $sp1_version"
          echo "::endgroup::"

          echo "::group::Run sp1up (bash -x trace, pinned version)"
          set +e
          bash -x "$(command -v sp1up)" --token "$SP1UP_TOKEN" --version "$sp1_version" 2>&1 | tee sp1up.log
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          if [ $exit_code -ne 0 ]; then
            echo "::error::sp1up failed with exit code $exit_code"
            echo "::group::sp1up failure log"
            cat sp1up.log
            echo "::endgroup::"
            exit $exit_code
          fi

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Create tag
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Publish zcam1-verify
        run: |
          cd zcam1-verify
          npm ci
          npm publish --access public --provenance

      - name: Publish react-native-zcam1
        run: |
          cd react-native-zcam1
          npm ci
          npm publish --access public --provenance
          zip -r Zcam1Framework.xcframework.zip Zcam1Framework.xcframework
          zip -r Zcam1ProvingFramework.xcframework.zip Zcam1ProvingFramework.xcframework

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ZCAM1 SDK v${{ github.event.inputs.version }}
          files: |
            react-native-zcam1/Zcam1Framework.xcframework.zip
            react-native-zcam1/Zcam1ProvingFramework.xcframework.zip
