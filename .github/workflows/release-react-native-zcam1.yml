name: Release react-native-zcam1

on:
  push:
    tags:
      - "react-native-zcam1-v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-15

    steps:
      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Install protoc
        run: brew install protobuf

      - name: Install sp1up
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            https://sp1.succinct.xyz | bash
          export PATH="$HOME/.sp1/bin:$PATH"
          echo "$HOME/.sp1/bin" >> $GITHUB_PATH

      - name: "Install SP1 toolchain"
        run: |
          set -euo pipefail
          SP1UP_TOKEN="${{ secrets.GH_TOKEN }}"

          if [ -z "$SP1UP_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is empty or not configured."
            exit 1
          fi

          releases_json=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $SP1UP_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/succinctlabs/sp1/releases/latest)
          sp1_version=$(printf '%s' "$releases_json" | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)

          if [ -z "$sp1_version" ]; then
            echo "::error::Failed to parse tag_name from GitHub releases API response."
            printf '%s\n' "$releases_json" | sed -n '1,80p'
            exit 1
          fi
          sp1up --token "$SP1UP_TOKEN" --version "$sp1_version"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Validate version
        run: |
          VERSION=${GITHUB_REF#refs/tags/react-native-zcam1-v}
          PKG_VERSION=$(node -p "require('./react-native-zcam1/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish react-native-zcam1
        run: |
          cd react-native-zcam1
          npm ci
          npm publish --access public --provenance
          zip -r Zcam1Framework.xcframework.zip Zcam1Framework.xcframework
          zip -r Zcam1ProvingFramework.xcframework.zip Zcam1ProvingFramework.xcframework
          cd android/src/main
          zip -r jniLibs.zip jniLibs
          zip -r jniLibsProving.zip jniLibsProving

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: react-native-zcam1 ${{ github.ref_name }}
          files: |
            react-native-zcam1/Zcam1Framework.xcframework.zip
            react-native-zcam1/Zcam1ProvingFramework.xcframework.zip
            react-native-zcam1/android/src/main/jniLibs.zip
            react-native-zcam1/android/src/main/jniLibsProving.zip
