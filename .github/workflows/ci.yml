name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: "TypeScript: lint, format & typecheck"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - react-native-zcam1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Check formatting
        working-directory: ${{ matrix.package }}
        run: npm run format:check

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint

  rust:
    name: "Rust: lint, format & test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -p zcam1-certs-utils
          cargo clippy -p zcam1-c2pa-utils --no-default-features --features io
          cargo clippy -p zcam1-ios
          cargo clippy -p zcam1-common
          cargo clippy -p zcam1-verify-utils

      - name: Test
        run: |
          cargo test -p zcam1-certs-utils
          cargo test -p zcam1-ios
          cargo test -p zcam1-common
          cargo test -p zcam1-verify-utils

  rust-macos:
    name: "Rust: test (macOS)"
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (c2pa-utils)
        run: cargo test -p zcam1-c2pa-utils
